services:
  #postgresql container whcih is got from offical psql documentation
  db: 
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
# this is build using dockerfile in root folder for our project 
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    #  output folder is shared across docker and root
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
